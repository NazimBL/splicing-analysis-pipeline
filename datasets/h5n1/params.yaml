# H5N1 (GSE287709 / PRJNA1214282), whole blood, SMART-Seq v4 + Nextera XT, PE 101.
# The samplesheet is built by build_samplesheet.py from the raw FASTQ file names.
dataset: h5n1
samplesheet: datasets/h5n1/samplesheet.csv
contrasts: datasets/h5n1/contrasts.csv
# Contrasts compare `timepoint`; b1 is the earlier timepoint (rMATS IncLevelDifference = b1 - b2).
# Pairing for --paired-stats is by `animal`; animals missing from either group are dropped.
group_column: timepoint
pair_column: animal

# Input and output locations are not stored here. Pass them on the command line
# (see the README, "Running a dataset").

# Library prep: Nextera XT, so fastp trims the Nextera transposase sequence
# (seen in FastQC on raw s001, 2026-10-15).
adapter: CTGTCTCTTATACACATCT
