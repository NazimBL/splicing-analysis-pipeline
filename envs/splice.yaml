name: splice
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # pinned: these decide the results
  - star=2.7.11b
  - rmats=4.4.0
  - trimmomatic=0.39
  - fastp=1.3.7          # adapter trimming (see docs/DECISIONS.md)
  # rMATS --paired-stats runs an R script that needs PAIRADISE
  - r-base=4.5
  - bioconductor-pairadise=1.26.0
  - r-doparallel
  - r-foreach
  - r-iterators
  - r-nloptr
  # utilities (exact versions recorded in splice.lock.yaml)
  - samtools
  - fastqc
  - multiqc
  - seqkit
  - pigz
